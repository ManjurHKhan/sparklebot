# WARNING: Do not scale beyond 1 replica. SQLite does not support concurrent writers.
replicaCount: 1

image:
  repository: ghcr.io/manjurhkhan/sparklebot
  tag: "1.1.0"
  pullPolicy: IfNotPresent

persistence:
  enabled: true
  size: 5Gi
  storageClass: ceph-block
  accessMode: ReadWriteOnce

slack:
  # References to existing K8s Secret (not created by this chart)
  existingSecret: sparklebot-slack
  botTokenKey: bot-token
  signingSecretKey: signing-secret
  appTokenKey: app-token

sparkle:
  currency: sparkle
  currencyPlural: sparkles
  emoji: ""
  personality: playful
  partyMinutes: 30

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  fsGroupChangePolicy: "OnRootMismatch"

securityContext:
  allowPrivilegeEscalation: false
  # Safe with SQLite/WAL because the db (+ -wal/-shm journals) lives on the
  # read-write PVC at /app/data — nothing writes the image filesystem.
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  capabilities:
    drop: ["ALL"]

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 256Mi
