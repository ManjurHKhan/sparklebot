# WARNING: Do not scale beyond 1 replica. SQLite does not support concurrent writers.
replicaCount: 1

image:
  repository: ghcr.io/manjurhkhan/sparklebot
  tag: "1.3.0"
  pullPolicy: IfNotPresent

persistence:
  enabled: true
  size: 5Gi
  storageClass: ceph-block
  accessMode: ReadWriteOnce

slack:
  # References to existing K8s Secret (not created by this chart)
  existingSecret: sparklebot-slack
  botTokenKey: bot-token
  signingSecretKey: signing-secret
  appTokenKey: app-token

sparkle:
  currency: sparkle
  currencyPlural: sparkles
  personality: playful
  partyMinutes: 30
  # Award budget: max awarded sparkles per giver per window.
  rateLimit: 10
  rateWindowSeconds: 60
  # Invocation throttle: max command runs per user per window (all commands).
  commandLimit: 20
  commandWindowSeconds: 60
  # Welcome new members on team_join (needs the team_join bot event). Channel ID; "" = off.
  welcomeChannel: ""
  # Channel tour in the welcome DM: up to 15 of {id, about}; about <= 120 chars.
  welcomeChannels: []
  # Emoji-only milestone burst: 1-23 :shortcodes:, <= 200 chars. "" = default.
  megaEmoji: ""
  # User ID that receives .suggest ideas by DM. "" = .suggest off.
  suggestTo: ""
  # Replace random message lists without a release: list name -> lines (up to 50, <= 500 chars).
  # Names: encouragement, selfSparkleShame, botSparkleQuips, firstSparkleCelebration,
  # partyAnnouncements, welcomePublic, welcomeDM, firstGiveBonus, agentNudge. A set list replaces
  # the personality's; Slack <…> markup in a line shows as text.
  messages: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  fsGroupChangePolicy: "OnRootMismatch"
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  # Safe with SQLite/WAL because the db (+ -wal/-shm journals) lives on the
  # read-write PVC at /app/data — nothing writes the image filesystem.
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  capabilities:
    drop: ["ALL"]

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 256Mi
