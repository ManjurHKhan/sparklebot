name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm run build

      - run: npm test

      - run: npm audit --omit=dev --audit-level=high

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v6

      - name: Build Docker image
        run: docker build -t sparklebot:ci .

      - name: Verify image structure
        run: |
          docker run --rm --entrypoint /nodejs/bin/node sparklebot:ci -e "
            const fs = require('fs');
            const required = ['dist/index.js', 'dist/framework/dispatcher.js', 'dist/commands/sparkle.js', 'dist/personalities/playful.json'];
            const missing = required.filter(f => !fs.existsSync(f));
            if (missing.length) { console.error('Missing files:', missing); process.exit(1); }
            console.log('All required files present');
          "

  helm-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - run: helm lint helm/sparklebot/

      - run: helm template sparklebot helm/sparklebot/ > /dev/null
